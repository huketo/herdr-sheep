# cargo-deny config (https://embarkstudios.github.io/cargo-deny/).
# Run `cargo deny check` (install: `cargo install cargo-deny`), or `just audit`.

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
# Every license in the current tree, and nothing else: a new dependency that
# drags in something else has to be looked at rather than waved through.
# `Unicode-3.0` arrives with unicode-ident, which is `(MIT OR Apache-2.0) AND
# Unicode-3.0` — the AND makes it mandatory, not a choice.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
]
confidence-threshold = 0.9

[sources]
unknown-registry = "deny"
unknown-git = "deny"
