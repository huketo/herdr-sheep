[package]
name = "herdr-sheep"
version = "0.2.0"
edition = "2021"
# The dependency tree's own floor: unicode-segmentation, through crossterm,
# wants 1.85. Claiming less would be a promise `cargo build` cannot keep.
rust-version = "1.85"
description = "Watch your Herdr coding agents as a flock of animated ASCII sheep"
license = "MIT"
repository = "https://github.com/huketo/herdr-sheep"

[dependencies]
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
