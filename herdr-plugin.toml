id = "huketo.sheep"
name = "Herdr Sheep"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Watch your Herdr agents as a flock of animated ASCII sheep."
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]

[[panes]]
id = "pasture"
title = "Sheep pasture"
description = "Animated pasture of every agent in the session"
placement = "split"
command = ["./target/release/herdr-sheep"]

[[actions]]
id = "open-pasture"
title = "Open sheep pasture"
description = "Open the pasture pane next to the current pane"
contexts = ["global"]
command = ["./scripts/open-pasture.sh"]
