name: release

# Build a prebuilt binary per supported platform and attach it to the GitHub Release for every
# v* tag. `herdr plugin install` runs herdr/install.sh, which downloads the asset matching the
# manifest version — so without this workflow, installing the plugin needs a Rust toolchain.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Sigstore-signed build provenance for every release archive, verifiable with
  # `gh attestation verify <archive> --repo huketo/herdr-sheep`.
  id-token: write
  attestations: write

jobs:
  # A tag push creates no Release object by itself, and the upload step below attaches to an
  # existing release, so the release is created first. Draft until every binary is attached:
  # a half-built release would install a 404.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # git-cliff walks the tags and the commits between them.
          fetch-depth: 0

      # install.sh downloads `v<manifest version>`, so a tag that disagrees with the manifest
      # would publish a release nobody can install. Fail before anything is built.
      - name: Version lockstep
        run: bash herdr/check-version.sh "$GITHUB_REF_NAME"

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      # The release body is this tag's section of the changelog, rendered straight from the
      # Conventional Commit subjects it contains, so the commit messages are the release notes.
      - name: Release notes
        run: git cliff --config cliff.toml --latest --strip header --output RELEASE_NOTES.md

      # Draft, and idempotent: a rerun of a failed release updates the notes instead of
      # falling over on a release that already exists.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --draft --title "herdr-sheep $version" --notes-file RELEASE_NOTES.md \
            --repo "$GITHUB_REPOSITORY" ||
            gh release edit "$GITHUB_REF_NAME" \
              --title "herdr-sheep $version" --notes-file RELEASE_NOTES.md \
              --repo "$GITHUB_REPOSITORY"

  binaries:
    needs: create-release
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Builds herdr-sheep for the target (cross-compiling aarch64 Linux through `cross` when
      # needed), archives it as herdr-sheep-<target>.tar.gz with a .sha256 sidecar, and uploads
      # both to this tag's release. herdr/install.sh expects exactly those names.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: herdr-sheep
          target: ${{ matrix.target }}
          archive: $bin-$target
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: herdr-sheep-${{ matrix.target }}.tar.gz

  # Publish only once every target attached its assets, so a failed target leaves a draft to
  # inspect instead of a release that installs a 404.
  publish:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
